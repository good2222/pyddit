{% extends 'portal/base.html' %}

{% block content %}
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Смена пароля</h1>
            <p class="auth-subtitle">Введите текущий пароль и задайте новый.</p>
        </div>

        <form method="post" novalidate>
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="field-error">{{ field.errors|striptags }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary">Изменить пароль</button>
            <a href="{% url 'profile' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
{% endblock %}
